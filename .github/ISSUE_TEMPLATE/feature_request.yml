name: Feature request
description: Propose a parser, export, runner, or workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What hunter workflow is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should Breadcrumb do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [parsers, graph/scope, AI, reports/exports, API/runners, UI, docs, other]
