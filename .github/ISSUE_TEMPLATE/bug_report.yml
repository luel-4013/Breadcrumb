name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Paste sample input (redact secrets) and steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Breadcrumb version (see page footer)
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
